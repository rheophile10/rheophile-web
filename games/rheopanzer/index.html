<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2221">
<title>rheopanzer</title>
<link rel="icon" id="favicon">
<style>
  :root {
    --bg: #0b0d0f; --panel: #141b1b; --slate: #2a3533; --slate-hi: #3a4845; --raised: #1b2423; --line: #2c3a36; --ink: #e6efe9; --muted: #8aa399;
    --accent: #2dd4bf; --frog: #b5d21e; --grin: #ff6a14; --bad: #ff7a3d; --good: #9bd35a; --gold: #f2d45c; --axis: #5fb8ad; --allies: #e0a24e;
    --bevel: inset 1px 1px 0 #ffffff14, inset -1px -1px 0 #00000066;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  button { background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; margin: 2px 2px 2px 0; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--frog); border-color: var(--frog); color: #10150a; font-weight: 700; }
  button.primary:hover:not(:disabled) { color: #000; box-shadow: 0 0 12px #b5d21e66; }
  button.quiet { background: transparent; }
  .icon { display: inline-flex; } .icon svg { display: block; }
  .icon-btn { padding: 4px; border-radius: 8px; }
  select, textarea, input { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 3px 6px; }
  table { border-collapse: collapse; }
  .muted { color: var(--muted); } .small { font-size: 11px; } .accent { color: var(--accent); } .good { color: var(--good); } .bad { color: var(--bad); } .error { color: var(--bad); }
  .grow { flex: 1; min-width: 0; } .pad { padding: 10px; }
  code { background: var(--raised); padding: 1px 5px; border-radius: 4px; }
  [hidden] { display: none !important; }
  body.dropping::after { content: "Drop the asset bundle to load it"; position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #0b0d0fd0; border: 3px dashed var(--frog); color: var(--frog); font-size: 20px; font-weight: 800; pointer-events: none; }

  /* command bar, after PG2's */
  #bar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: linear-gradient(#26312f, #1a2221); border-bottom: 1px solid #000; box-shadow: var(--bevel); min-width: 0; }
  #bar .brand { background: none; border: 0; padding: 0 4px 0 0; gap: 6px; }
  #bar .brand svg { width: 32px; height: 32px; }
  .wordmark { font-weight: 800; letter-spacing: .01em; color: var(--frog); text-shadow: 0 0 14px #14b8a655; }
  #bar .brand .wordmark { font-size: 16px; }
  .turn, .who { display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap; }
  .who { padding-left: 10px; border-left: 3px solid var(--axis); } .who.side1 { border-left-color: var(--allies); }
  .cmds { display: flex; gap: 8px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .group { display: flex; gap: 2px; padding: 2px; background: #0d1212; border-radius: 10px; box-shadow: inset 0 1px 3px #000a; }
  .cmd { width: 34px; height: 32px; justify-content: center; padding: 0; margin: 0; border-radius: 8px; background: linear-gradient(#34423f, #232d2b); border: 1px solid #0b0f0f; box-shadow: var(--bevel); color: #cfe2da; }
  .cmd:hover:not(:disabled) { color: var(--frog); border-color: #0b0f0f; background: linear-gradient(#3d4d49, #29343231); }
  .cmd.on { color: var(--frog); background: linear-gradient(#2c3a1b, #1d2612); box-shadow: inset 0 0 0 1px #b5d21e55, var(--bevel); }
  .cmd:active:not(:disabled) { transform: translateY(1px); }
  .end-turn { background: linear-gradient(#c9e33a, #93ad12); color: #11170a; font-weight: 800; border: 1px solid #000; border-radius: 10px; padding: 7px 14px; box-shadow: var(--bevel), 0 0 14px #b5d21e33; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; }
  .end-turn:hover:not(:disabled) { color: #000; box-shadow: var(--bevel), 0 0 18px #b5d21e77; border-color: #000; }

  /* the map with its floating panels */
  #stage { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; overflow: auto; background: radial-gradient(circle at 40% 30%, #10201d, var(--bg) 70%); }
  canvas { display: block; }
  .panel { background: #141b1bf2; border: 1px solid #000; border-radius: 10px; box-shadow: var(--bevel), 0 6px 24px #000a; }
  #card { position: absolute; left: 12px; bottom: 12px; width: 340px; padding: 8px 10px; }
  .card-head { display: flex; align-items: center; gap: 6px; }
  .card-head .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-tools { display: flex; }
  .card-tools button, .card-head > button { margin: 0; }
  .card-mini { display: flex; gap: 6px; }
  .flag { width: 21px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px #0008; display: inline-block; vertical-align: middle; flex: none; }
  .card-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 6px; }
  .card-chips.small-chips { grid-template-columns: repeat(5, 1fr); font-size: 11px; }
  .chip-stat { display: flex; align-items: center; gap: 3px; background: #0d1212; border-radius: 6px; padding: 2px 5px; flex-wrap: wrap; min-width: 0; }
  .chip-stat .icon svg { width: 15px; height: 15px; color: var(--accent); }
  .small-chips .chip-stat .icon svg { width: 13px; height: 13px; color: var(--muted); }
  .chip-stat .meter { flex-basis: 100%; }
  .trait-strip { display: inline-flex; gap: 2px; vertical-align: middle; } .trait-strip svg { width: 14px; height: 14px; color: var(--frog); }
  .trait-icon svg { width: 16px; height: 16px; color: var(--frog); vertical-align: -3px; margin-right: 3px; }
  .stat .icon svg { width: 16px; height: 16px; color: var(--accent); }
  .transport-picks { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .transport-pick { flex-direction: column; border-radius: 8px; min-width: 104px; margin: 0; padding: 3px 6px; gap: 1px; background: #0d1212; font-size: 11px; }
  .transport-pick.on { background: #26331a; border-color: var(--frog); color: var(--frog); }
  .transport-pick small { color: var(--gold); }
  .transport-stats { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  .transport-stats .stats { grid-template-columns: repeat(4, 1fr); font-size: 11px; }
  .transport-stats .stat.wide { grid-column: span 4; }
  .none-pic { height: 40px; display: grid; place-items: center; color: var(--muted); }
  .now-playing { margin: 2px 0 6px; }
  .track-pick { max-width: 100%; }
  .mood-silly { color: #ff9ad5 !important; }
  body.docked #map { right: 360px; }
  #side { position: absolute; right: 0; top: 0; bottom: 0; width: 360px; border-radius: 0; border-width: 0 0 0 1px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  #side #card, #side #forecast { position: static; width: auto; }
  #side #forecast { pointer-events: auto; flex: 1; min-height: 0; }
  .card-top { display: flex; gap: 8px; align-items: center; }
  .card-top canvas { background: radial-gradient(circle, #2a3a36, #121817); border-radius: 8px; flex: none; }
  .card-stats { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 3px 8px; align-items: center; margin-top: 6px; font-size: 12px; }
  .meter { height: 5px; background: #0b0f0f; border-radius: 3px; overflow: hidden; } .meter div { height: 100%; background: var(--accent); }
  .meter.str div { background: var(--frog); } .meter.fuel div { background: var(--gold); }
  .card-actions { margin-top: 6px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .card-leader { margin-top: 5px; color: var(--gold); }
  .stars { color: var(--gold); letter-spacing: 1px; }
  #forecast { position: absolute; right: 12px; top: 12px; bottom: 12px; width: 360px; overflow-y: auto; padding: 10px 12px; font-size: 12px; pointer-events: none; }
  #loading { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); width: min(320px, 80%); height: 22px; background: #0b0d0fe6; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; z-index: 20; }
  #loading div { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2dd4bf66, #b5d21e99); transition: width .2s; }
  #loading span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 20px; }
  #status { display: flex; gap: 4px; align-items: center; padding: 4px 12px; background: linear-gradient(#1a2221, #121817); border-top: 1px solid #000; min-height: 26px; white-space: nowrap; overflow: hidden; }
  .status-aim { color: #ffd9c7; } .status-aim.no { color: var(--muted); }
  .unit-tag.side0 { color: var(--axis); } .unit-tag.side1 { color: var(--allies); }
  .coords { margin-left: auto; }
  #drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 330px; overflow-y: auto; padding: 10px 14px; border-radius: 0; border-width: 0 0 0 1px; z-index: 3; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 4px 0; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 14px 0 4px; }
  .log { font-size: 12px; max-height: 240px; overflow-y: auto; } .log div { border-bottom: 1px solid var(--line); padding: 2px 0; }
  .player-row { margin: 3px 0; }
  details { margin: 6px 0; } summary { cursor: pointer; color: var(--accent); }
  .prose { white-space: pre-wrap; font-size: 12px; max-height: 260px; overflow-y: auto; margin-top: 4px; }
  .outcome { background: #1f2a12; border: 1px solid var(--frog); padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
  textarea { width: 100%; min-height: 60px; }

  /* the forecast */
  .fc-head { font-size: 13px; margin-bottom: 6px; }
  .fc-verdict { display: flex; gap: 6px; margin: 4px 0 6px; }
  .fc-verdict div { flex: 1; background: #0d1212; border-radius: 8px; padding: 4px 6px; display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 1px 3px #000a; }
  .fc-verdict .big { font-size: 20px; font-weight: 800; line-height: 1.1; } .fc-verdict small { color: var(--muted); font-size: 10px; }
  .bad-ink { color: #ffb08a; }
  .fc-rout { color: var(--gold); margin: 4px 0; font-weight: 600; }
  .dist { margin: 6px 0; } .dist-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); } .dist-head span:first-child { color: var(--ink); font-weight: 600; }
  .dist-bars { display: flex; align-items: flex-end; gap: 2px; height: 42px; margin-top: 2px; }
  .dist-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 9px; color: var(--muted); }
  .dist-bar { width: 100%; background: #3c4a47; border-radius: 2px 2px 0 0; min-height: 1px; }
  .dist.enemy .dist-bar.likely { background: var(--grin); } .dist.own .dist-bar.likely { background: var(--accent); } .dist.pinned .dist-bar.likely { background: var(--gold); }
  .fc-section { margin: 6px 0; } .fc-title { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .fc-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  h4 { margin: 10px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
  .mods { width: 100%; font-size: 11px; } .mods td { padding: 0 2px; vertical-align: top; } .mods .num { text-align: right; white-space: nowrap; } .mods .total td { border-top: 1px solid var(--line); font-weight: 700; }
  .note { font-size: 11px; margin: 3px 0; color: #c7d6d0; } .note.muted { color: var(--muted); }

  /* dialogs */
  #screen { position: fixed; inset: 0; background: #050808b0; display: grid; place-items: center; padding: 16px; z-index: 8; }
  .dialog { background: linear-gradient(#2c3836, #1f2826); border: 1px solid #000; border-radius: 12px; box-shadow: var(--bevel), 0 20px 60px #000c; width: min(1060px, 100%); max-height: 92vh; display: flex; flex-direction: column; padding: 10px 14px 14px; gap: 8px; }
  .dialog.narrow { width: min(460px, 100%); align-items: center; text-align: center; }
  .dialog-head { display: flex; align-items: center; gap: 10px; }
  .dialog-head h2 { font-size: 15px; margin: 0; color: var(--frog); letter-spacing: .06em; }
  .prestige { color: var(--gold); font-weight: 700; }
  .buy-layout { display: grid; grid-template-columns: 110px minmax(260px, 1fr) minmax(300px, 1.2fr); gap: 10px; min-height: 0; flex: 1; }
  .classes { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .class-btn { flex-direction: column; border-radius: 8px; padding: 2px 4px; margin: 0; gap: 0; background: linear-gradient(#34423f, #232d2b); border-color: #0b0f0f; box-shadow: var(--bevel); font-size: 11px; }
  .class-btn.on { background: linear-gradient(#3a4d22, #26331a); color: var(--frog); box-shadow: inset 0 0 0 1px #b5d21e66, var(--bevel); }
  .catalogue { display: flex; flex-direction: column; min-height: 0; gap: 6px; }
  .filters { display: flex; gap: 6px; }
  .eq-list, .roster, .saves { overflow-y: auto; background: #0f1414; border-radius: 8px; box-shadow: inset 0 1px 4px #000c; min-height: 120px; }
  .eq-list { flex: 1; max-height: 64vh; }
  .eq-row { display: flex; align-items: center; gap: 8px; padding: 2px 8px 2px 2px; border-bottom: 1px solid #1c2524; cursor: pointer; }
  .eq-row:hover { background: #1b2524; } .eq-row.on { background: #26331a; } .eq-row.current b { color: var(--accent); }
  .eq-row .cost { color: var(--gold); font-weight: 700; }
  .eq-detail { overflow-y: auto; max-height: 72vh; background: #121918; border-radius: 8px; padding: 8px 10px; box-shadow: inset 0 1px 4px #000a; }
  .eq-detail h3 { color: var(--ink); font-size: 16px; text-transform: none; letter-spacing: 0; margin: 4px 0 0; }
  .portrait { display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #3a4b46, #0f1414 75%); border-radius: 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 8px 0; }
  .stat { display: flex; align-items: center; gap: 4px; background: #0d1212; border-radius: 6px; padding: 2px 6px; font-size: 12px; } .stat .label { flex: 1; font-size: 11px; color: var(--muted); } .stat small { font-weight: 700; }
  .stat.wide { grid-column: span 3; } .stat.wide + .stat.wide { grid-column: span 3; }
  .traits { margin: 4px 0; padding-left: 18px; font-size: 12px; } .traits li { margin: 2px 0; } .traits b { color: var(--frog); } .traits .muted b { color: var(--muted); }
  .transport { margin: 6px 0; }
  .buy-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px; } .price { color: var(--gold); font-weight: 700; }
  .reserve-strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .chip { background: #0d1212; border-radius: 999px; padding: 1px 8px; }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; } .tabs.left { justify-content: flex-start; }
  .roster { max-height: 70vh; }
  .roster-row { display: flex; align-items: center; gap: 10px; padding: 3px 8px 3px 3px; border-bottom: 1px solid #1c2524; }
  .roster-pic { cursor: pointer; } .roster-pic canvas { background: radial-gradient(circle, #2a3a36, #121817); border-radius: 8px; display: block; }
  .roster-num { display: flex; flex-direction: column; align-items: center; min-width: 46px; line-height: 1.1; } .roster-num small { color: var(--muted); font-size: 10px; }
  .roster-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: 380px; }
  .star { color: var(--gold); }
  .unit-record { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; overflow-y: auto; }
  .record-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; }
  .leader { background: #1f2a12; border-left: 3px solid var(--frog); padding: 6px 8px; margin: 6px 0; border-radius: 6px; font-size: 12px; }
  .transport-card { display: flex; align-items: center; gap: 8px; background: #0d1212; border-radius: 8px; padding: 4px 8px; margin-top: 6px; }
  .saves { max-height: 55vh; }
  .save-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #1c2524; cursor: pointer; } .save-row.on { background: #1b2524; }
  .save-name { display: flex; align-items: center; gap: 6px; } .save-name input { flex: 1; }
  .small-title svg { width: 90px; height: 90px; }

  /* the games menu */
  #menu { position: fixed; inset: 0; background: radial-gradient(circle at 50% 35%, #0f2b27ee, #0b0d0ff5 65%); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .menu-box { background: #11171af2; border: 1px solid var(--line); border-radius: 16px; width: min(880px, 100%); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; padding: 18px; box-shadow: 0 0 60px #14b8a622; }
  .title { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
  .title svg { width: min(210px, 50vw); height: auto; }
  .title .wordmark { font-size: clamp(34px, 7vw, 54px); line-height: 1; }
  .title .tagline { color: var(--accent); }
  .menu-head { display: flex; justify-content: space-between; align-items: center; }
  .menu-head.compact svg { width: 42px; height: 42px; } .menu-head.compact { justify-content: flex-start; gap: 10px; }
  .menu-box input[type=search] { border-radius: 999px; padding: 6px 12px; }
  .list { overflow-y: auto; border-top: 1px solid var(--line); }
  .row { padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; } .row:hover { background: var(--raised); }
  .resume { background: #1f2a12; border: 1px solid var(--frog); padding: 7px 10px; border-radius: 10px; }

  @media (max-width: 1100px) { .turn { display: none; } .buy-layout { grid-template-columns: 90px 1fr; } .eq-detail { grid-column: span 2; } }
  @media (pointer: coarse) { .cmd { width: 42px; height: 40px; } button { padding: 6px 12px; } .icon-btn { padding: 6px; } }
  /* phones: commands along the bottom within thumb reach, panels as bottom sheets, dialogs full screen */
  @media (max-width: 760px) {
    body { grid-template-rows: auto 1fr auto auto; }
    #bar { gap: 6px; padding: 4px 8px; padding-top: max(4px, env(safe-area-inset-top)); }
    #bar .brand .wordmark, .turn { display: none; }
    .who { display: flex; flex: 1; min-width: 0; border-left-width: 2px; padding-left: 6px; font-size: 12px; } .who span { overflow: hidden; text-overflow: ellipsis; }
    .cmds { order: 5; position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); background: linear-gradient(#1a2221, #101615); border-top: 1px solid #000; scrollbar-width: none; }
    .cmds::-webkit-scrollbar { display: none; }
    .group { flex: none; }
    .end-turn { padding: 8px 10px; }
    #status { margin-bottom: calc(52px + env(safe-area-inset-bottom)); font-size: 12px; }
    #card, body.docked #card { position: absolute; left: 6px; right: 6px; bottom: 6px; width: auto; }
    body.docked #map { right: 0; }
    #side { display: contents; }
    #side[hidden] { display: none !important; }
    #forecast, body.docked #forecast { position: absolute; left: 6px; right: 6px; top: 6px; bottom: auto; width: auto; max-height: 48%; pointer-events: auto; flex: none; }
    #drawer { width: 100%; }
    #screen { padding: 0; }
    .dialog { width: 100%; max-height: 100%; height: 100%; border-radius: 0; padding: 8px; padding-top: max(8px, env(safe-area-inset-top)); overflow-y: auto; }
    .buy-layout { grid-template-columns: 1fr; display: flex; flex-direction: column; flex: none; }
    .catalogue { min-height: auto; }
    .classes { flex-direction: row; overflow-x: auto; flex: none; }
    .class-btn { min-width: 76px; }
    .eq-list { height: 34vh; max-height: none; flex: none; } .eq-detail { max-height: none; overflow: visible; }
    .stats { grid-template-columns: repeat(2, 1fr); } .stat.wide { grid-column: span 2; }
    .unit-record { grid-template-columns: 1fr; }
    .roster-row { flex-wrap: wrap; } .roster-actions { max-width: none; width: 100%; justify-content: flex-start; }
    .card-chips.small-chips { grid-template-columns: repeat(4, 1fr); }
    .menu-box { max-height: 100%; border-radius: 0; }
    #menu { padding: 0; }
  }
</style>
</head>
<body>
<header id="bar"></header>
<div id="stage">
  <div id="map"><canvas id="board"></canvas></div>
  <div id="loading" hidden><div></div><span></span></div>
  <div id="card" class="panel" hidden></div>
  <div id="forecast" class="panel" hidden></div>
  <aside id="side" class="panel" hidden></aside>
  <aside id="drawer" class="panel" hidden></aside>
</div>
<footer id="status"></footer>
