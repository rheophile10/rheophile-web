<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Freedoom · rheophile chat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #d4d4d8; font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); image-rendering: pixelated; background: #000; outline: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 10px; background: #000; padding: 24px; }
      #status[hidden] { display: none; }
      .bar { width: 240px; max-width: 70vw; height: 6px; border-radius: 3px; background: #27272a; overflow: hidden; }
      .bar > div { height: 100%; width: 0; background: #2dd4bf; transition: width 0.15s; }
      #retry { margin-top: 4px; padding: 8px 16px; border: 1px solid #3f3f46; border-radius: 10px; background: #18181b; color: #e4e4e7; font: inherit; cursor: pointer; }
      #retry[hidden] { display: none; }

      /* touch controls — see touch.js */
      #touch { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
      #touch .stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 42%; pointer-events: auto; touch-action: none; }
      #touch .stick-base { position: absolute; left: 18%; top: 70%; width: min(30vh, 150px); aspect-ratio: 1; margin: calc(min(30vh, 150px) / -2) 0 0 calc(min(30vh, 150px) / -2); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.05); opacity: 0.55; display: grid; place-items: center; }
      #touch .stick-base.active { opacity: 1; }
      #touch .stick-knob { width: 42%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 2px solid rgba(255, 255, 255, 0.35); }
      #touch .tbtn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.75); font: 700 12px/1 -apple-system, sans-serif; letter-spacing: 0.08em; -webkit-tap-highlight-color: transparent; }
      #touch .tbtn.down { background: rgba(255, 255, 255, 0.3); color: #fff; }
      #touch .tbtn-fire { right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: min(24vh, 108px); height: min(24vh, 108px); border-color: rgba(248, 113, 113, 0.55); background: rgba(248, 113, 113, 0.12); }
      #touch .tbtn-use { right: calc(max(18px, env(safe-area-inset-right)) + min(24vh, 108px) + 14px); bottom: max(22px, env(safe-area-inset-bottom)); width: min(17vh, 76px); height: min(17vh, 76px); }
      #touch .tbtn-menu { right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); width: 40px; height: 40px; font-size: 18px; }
      #touch .rotate-hint { display: none; position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); color: #e4e4e7; font-size: 13px; white-space: nowrap; }
      @media (orientation: portrait) { #touch .rotate-hint { display: block; } }
      /* Belt and braces: never show touch controls where a mouse is present. */
      @media (pointer: fine), (hover: hover) { #touch { display: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
    <div id="status">
      <div id="status-text">Starting Freedoom…</div>
      <div class="bar"><div id="progress"></div></div>
      <button id="retry" hidden>Try again</button>
    </div>
    <script src="bridge.js"></script>
    <script src="touch.js"></script>
    <script>
      // Launched by the chat page as  doom/index.html#role=host&players=2&mode=dm&skill=3&map=1
      //
      // The engine's glue (websockets-doom.js) is NOT loaded up front: left to its own devices it
      // fetches the 28 MB WAD the instant this page exists, with only a coarse per-file progress
      // report. Instead the WAD is downloaded here first — with a real byte-level bar, and cached so a
      // rematch is instant — and only then is the engine injected, its filesystem pre-seeded with the
      // bytes already in hand. The download therefore begins when Doom is activated (this page is
      // created only when a match starts) and not a moment before.
      (() => {
        const params = new URLSearchParams(location.hash.slice(1));
        const role = ['host', 'join', 'solo'].includes(params.get('role')) ? params.get('role') : 'join';
        const players = Math.min(4, Math.max(2, Number(params.get('players')) || 2));
        const skill = Math.min(5, Math.max(1, Number(params.get('skill')) || 3));
        const map = Math.min(32, Math.max(1, Number(params.get('map')) || 1));
        const mode = params.get('mode') === 'coop' ? 'coop' : 'dm';

        const args = ['-iwad', 'freedoom2.wad', '-window', '-nogui', '-nomusic', '-config', 'default.cfg', '-wss', 'rtc://peer'];
        if (role === 'host') {
          args.push('-server', '-nodes', String(players), '-skill', String(skill), '-warp', String(map));
          if (mode === 'dm') args.push('-deathmatch');
        } else if (role === 'join') {
          args.push('-connect', '1');
        } else {
          args.push('-skill', String(skill), '-warp', String(map));
        }

        const statusBox = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const progress = document.getElementById('progress');
        const retry = document.getElementById('retry');
        const say = (text) => (statusText.textContent = text);
        const setBar = (frac) => (progress.style.width = `${Math.max(0, Math.min(1, frac)) * 100}%`);
        const tell = (type, extra) => window.parent.postMessage({ type, ...extra }, location.origin);
        const mb = (bytes) => (bytes / 1048576).toFixed(1);

        const WAD_URL = 'freedoom2.wad';
        const WAD_CACHE = 'freedoom-wad-v1';

        // Stream the WAD, reporting progress by bytes. Served from (and stored into) a named cache so a
        // rematch or reload does not download it again.
        const downloadWad = async (onProgress) => {
          const cache = await caches.open(WAD_CACHE).catch(() => null);
          if (cache) {
            const hit = await cache.match(WAD_URL).catch(() => null);
            if (hit) {
              onProgress(1, 0, 0, true);
              return new Uint8Array(await hit.arrayBuffer());
            }
          }
          const response = await fetch(WAD_URL);
          if (!response.ok || !response.body) throw new Error(`download failed (${response.status})`);
          const total = Number(response.headers.get('Content-Length')) || 0;
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            onProgress(total ? received / total : 0, received, total, false);
          }
          const bytes = new Uint8Array(received);
          let offset = 0;
          for (const chunk of chunks) {
            bytes.set(chunk, offset);
            offset += chunk.length;
          }
          if (cache) {
            cache
              .put(WAD_URL, new Response(bytes.slice(), { headers: { 'Content-Type': 'application/octet-stream', 'Content-Length': String(received) } }))
              .catch(() => undefined);
          }
          return bytes;
        };

        const startEngine = (wad, cfg) => {
          window.Module = {
            noInitialRun: true,
            canvas: document.getElementById('canvas'),
            // The bytes are already in hand, so preRun just writes them into the in-memory FS.
            preRun: [
              () => {
                Module.FS.writeFile('freedoom2.wad', wad);
                Module.FS.writeFile('default.cfg', cfg);
              },
            ],
            onRuntimeInitialized: () => {
              statusBox.hidden = true;
              document.getElementById('canvas').focus();
              tell('doom:running', { role });
              Module.callMain(args);
            },
            print: (text) => {
              console.log(text);
              window.doomStatus(text);
            },
            printErr: (text) => console.warn(text),
            onAbort: (what) => tell('doom:exit', { reason: String(what) }),
            onExit: (code) => tell('doom:exit', { reason: `exited (${code})` }),
          };
          const script = document.createElement('script');
          script.src = 'websockets-doom.js';
          document.body.appendChild(script);
        };

        const boot = async () => {
          retry.hidden = true;
          setBar(0);
          try {
            const cfg = new Uint8Array(await (await fetch('default.cfg')).arrayBuffer());
            say('Downloading Freedoom…');
            const wad = await downloadWad((frac, received, total, cached) => {
              setBar(cached ? 1 : frac);
              if (cached) say('Loading Freedoom…');
              else if (total) say(`Downloading Freedoom… ${mb(received)} / ${mb(total)} MB`);
              else say(`Downloading Freedoom… ${mb(received)} MB`);
            });
            setBar(1);
            say('Starting…');
            startEngine(wad, cfg);
          } catch (error) {
            say(`Could not load Freedoom: ${error.message}`);
            setBar(0);
            retry.hidden = false;
          }
        };

        retry.addEventListener('click', boot);
        window.addEventListener('error', (event) => tell('doom:exit', { reason: String(event.message) }));
        boot();
      })();
    </script>
  </body>
</html>
