<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Freedoom · rheophile chat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #d4d4d8; font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); image-rendering: pixelated; background: #000; outline: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; background: #000; }
      #status[hidden] { display: none; }
      .bar { width: 240px; height: 6px; border-radius: 3px; background: #27272a; overflow: hidden; }
      .bar > div { height: 100%; width: 0; background: #2dd4bf; transition: width 0.2s; }

      /* touch controls — see touch.js */
      #touch { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; touch-action: none; }
      #touch .stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 42%; pointer-events: auto; touch-action: none; }
      #touch .stick-base { position: absolute; left: 18%; top: 70%; width: min(30vh, 150px); aspect-ratio: 1; margin: calc(min(30vh, 150px) / -2) 0 0 calc(min(30vh, 150px) / -2); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.05); opacity: 0.55; display: grid; place-items: center; }
      #touch .stick-base.active { opacity: 1; }
      #touch .stick-knob { width: 42%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 2px solid rgba(255, 255, 255, 0.35); }
      #touch .tbtn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.75); font: 700 12px/1 -apple-system, sans-serif; letter-spacing: 0.08em; -webkit-tap-highlight-color: transparent; }
      #touch .tbtn.down { background: rgba(255, 255, 255, 0.3); color: #fff; }
      #touch .tbtn-fire { right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: min(24vh, 108px); height: min(24vh, 108px); border-color: rgba(248, 113, 113, 0.55); background: rgba(248, 113, 113, 0.12); }
      #touch .tbtn-use { right: calc(max(18px, env(safe-area-inset-right)) + min(24vh, 108px) + 14px); bottom: max(22px, env(safe-area-inset-bottom)); width: min(17vh, 76px); height: min(17vh, 76px); }
      #touch .tbtn-menu { right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); width: 40px; height: 40px; font-size: 18px; }
      #touch .rotate-hint { display: none; position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); color: #e4e4e7; font-size: 13px; white-space: nowrap; }
      @media (orientation: portrait) { #touch .rotate-hint { display: block; } }
      /* Belt and braces: never show touch controls where a mouse is present. */
      @media (pointer: fine), (hover: hover) { #touch { display: none !important; } }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
    <div id="status"><div id="status-text">Loading Freedoom…</div><div class="bar"><div id="progress"></div></div></div>
    <script src="bridge.js"></script>
    <script src="touch.js"></script>
    <script>
      // Launched by the chat page as  doom/index.html#role=host&players=2&mode=dm&skill=3&map=1
      (() => {
        const params = new URLSearchParams(location.hash.slice(1));
        const role = ['host', 'join', 'solo'].includes(params.get('role')) ? params.get('role') : 'join';
        const players = Math.min(4, Math.max(2, Number(params.get('players')) || 2));
        const skill = Math.min(5, Math.max(1, Number(params.get('skill')) || 3));
        const map = Math.min(32, Math.max(1, Number(params.get('map')) || 1));
        const mode = params.get('mode') === 'coop' ? 'coop' : 'dm';

        const args = ['-iwad', 'freedoom2.wad', '-window', '-nogui', '-nomusic', '-config', 'default.cfg', '-wss', 'rtc://peer'];
        if (role === 'host') {
          args.push('-server', '-nodes', String(players), '-skill', String(skill), '-warp', String(map));
          if (mode === 'dm') args.push('-deathmatch');
        } else if (role === 'join') {
          args.push('-connect', '1');
        } else {
          args.push('-skill', String(skill), '-warp', String(map));
        }

        const statusBox = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const progress = document.getElementById('progress');
        const say = (text) => (statusText.textContent = text);
        const tell = (type, extra) => window.parent.postMessage({ type, ...extra }, location.origin);

        window.Module = {
          noInitialRun: true,
          canvas: document.getElementById('canvas'),
          preRun: [
            () => {
              Module.FS.createPreloadedFile('', 'freedoom2.wad', 'freedoom2.wad', true, true);
              Module.FS.createPreloadedFile('', 'default.cfg', 'default.cfg', true, true);
            },
          ],
          onRuntimeInitialized: () => {
            statusBox.hidden = true;
            document.getElementById('canvas').focus();
            tell('doom:running', { role });
            Module.callMain(args);
          },
          print: (text) => {
            console.log(text);
            window.doomStatus(text);
          },
          printErr: (text) => console.warn(text),
          setStatus: (text) => {
            if (!text) return;
            const parts = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text);
            if (parts) progress.style.width = `${(100 * Number(parts[1])) / Number(parts[2])}%`;
            say(text.replace(/\(\d.*\)/, '').trim() || 'Loading Freedoom…');
          },
          onAbort: (what) => tell('doom:exit', { reason: String(what) }),
          onExit: (code) => tell('doom:exit', { reason: `exited (${code})` }),
        };
        window.addEventListener('error', (event) => tell('doom:exit', { reason: String(event.message) }));
      })();
    </script>
    <script src="websockets-doom.js"></script>
  </body>
</html>
